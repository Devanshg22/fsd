<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    .parent{
        padding: 43px;
        margin: 34px;
        border: 2px solid black;
        position: absolute;
    }

    .box {
        border: 2px solid black;
        height: 130px;
        width: 80vw;
        padding: 3px;
        margin: 3px;
    }

    .box1 {
        background-color: aqua;
        position: absolute;
        top: 0px;
        right: 79px;
    }

    .box2 {
        background-color: beige;
        position: relative;
        top: 20px;
        left: 30px;
    }

    .box3 {
        background-color: chocolate;
        position: fixed;
        bottom: 70px;
        right: 90px;
    }

    .box4 {
        background-color: blueviolet;
        position: sticky;
    }
</style>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>

</body>

</html>
