<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css list</title>
</head>
<style>
    nav ul {
        display:flex;
    }
    nav ul li{
        list-style: devanagari;
        /* list-style-type: square; */
        color: blue;
        list-style-position: inside;
        border: 2px solid black;
        word-spacing: 20px;

        
        padding: 10px black
        ;
        
    }
</style>
<body>
    <nav>
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </nav>
</body>
</html>
