<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style> 
:root{
    --primary-color: rgba(19, 120, 197, 0.917);
    --text-color:white;
    --seccolor:rgba(70, 97, 158, 0.628);
}
 *{
    margin: 0px;
    padding: 0px;

}
nav{
    background-color: var(--primary-color);
    padding: 23px;
}
ul li{
    list-style: none;
    display: inline;
    padding: 23px;
    font-weight: bolder;
    color:var(--text-color)
}
ul li a{
    text-decoration: none;
    color: var(--text-color);
}

</style>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/">conatct</a></li>
                <li><a href="/">heyyy</a></li>
                <li><a href="/">about</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
