<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sizing</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width: 10vw;
            /* height: 20vw; */
            border: 2px solid black;
            background-color: red;
            margin:23px auto;
            box-sizing: border-box;
        }   
        .container{
            width: 90vw;
            min-height: 90vw;
            border: 2px solid black;
            background-color: rgb(129, 131, 150);
            margin:23px auto;
            box-sizing: border-box;
        }
        .mycont{
           border:2px solid black;
           box-sizing: border-box;
           margin: 23px auto;
            width: 10vw;
            font-size: 22px;
            background-color: rgb(129, 131, 150);}
            
    </style>
</head>
<body>
    <div class="box">
        this is a box
    </div>
    <div class="container">
        this is a box
    </div>
    <footer class="mycont"><p>fr45y45</p></footer>
</body>
</html>
